name: CI

# Pull requests and pushes to main: build the Dockerfile's test stage and test the Helm chart. Nothing is published.
# Customers deploy this collector themselves, so there is no Argo/Fleet promotion: public semver images and the
# Helm chart are scanned and published by release.yml on a v*.*.* tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --target test .

  # The Docker test stage cannot see the chart (it is outside the build context), so test it here.
  chart-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: python -m unittest discover -s tests -v
      - run: helm lint deploy/helm/toduen-collector --set-string toduen.projectId=e627bc7e-01b6-46ed-9e4d-72ed598e3634 --set-string toduen.apiToken=todc.lint
