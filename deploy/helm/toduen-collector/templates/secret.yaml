{{- if and .Values.toduen.apiToken (not .Values.toduen.existingSecret) (not .Values.toduen.tokenFile) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "toduen-collector.tokenSecret" . }}
  labels: {{- include "toduen-collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.toduen.apiToken | quote }}
{{- end }}
