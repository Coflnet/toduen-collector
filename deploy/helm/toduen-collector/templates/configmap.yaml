{{- include "toduen-collector.validate" . -}}
{{- $config := dict "prometheusUrl" .Values.prometheus.url "todUrl" .Values.toduen.url "projectId" .Values.toduen.projectId
    "todTokenFile" (include "toduen-collector.tokenPath" .) "intervalSeconds" (int .Values.intervalSeconds)
    "maxSourceAgeSeconds" (int .Values.maxSourceAgeSeconds) "dayOffsets" .Values.dayOffsets
    "backfillDays" (int .Values.backfillDays) "backfillIntervalSeconds" (int .Values.backfillIntervalSeconds) -}}
{{- if eq .Values.prometheus.auth.type "bearer" }}{{ $_ := set $config "prometheusTokenFile" "/var/run/secrets/prometheus/token" }}{{ end -}}
{{- if eq .Values.prometheus.auth.type "basic" }}{{ $_ := set $config "prometheusBasicAuthFile" "/var/run/secrets/prometheus/basic" }}{{ end -}}
{{- $metrics := list -}}
{{- range .Values.metrics -}}
{{- $entry := dict "key" .key "displayName" (default .key .displayName) "unit" .unit "aggregation" .aggregation "query" .query -}}
{{- if .timestampQuery }}{{ $_ := set $entry "timestampQuery" .timestampQuery }}{{ end -}}
{{- $metrics = append $metrics $entry -}}
{{- end -}}
{{- $_ := set $config "metrics" $metrics -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "toduen-collector.fullname" . }}
  labels: {{- include "toduen-collector.labels" . | nindent 4 }}
data:
  config.json: {{ $config | toJson | quote }}
