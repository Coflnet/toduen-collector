{{- if .Values.networkPolicy.enabled }}
{{- $url := urlParse .Values.prometheus.url -}}
{{- $host := (split ":" $url.host)._0 -}}
{{- $port := ternary (default "80" (index (split ":" $url.host) "_1")) (default "443" (index (split ":" $url.host) "_1")) (eq $url.scheme "http") -}}
{{- $namespace := default .Release.Namespace .Values.networkPolicy.prometheus.namespace -}}
{{- if not .Values.networkPolicy.prometheus.namespace -}}
{{- $match := regexFind "^[^.]+\\.[^.]+\\.svc" $host -}}
{{- if $match }}{{ $namespace = (split "." $match)._1 }}{{ end -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "toduen-collector.fullname" . }}
  labels: {{- include "toduen-collector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "toduen-collector.selector" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 14 }}
          podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $namespace | quote }}
          podSelector:
            {{- if .Values.networkPolicy.prometheus.podSelector }}
            matchLabels: {{- toYaml .Values.networkPolicy.prometheus.podSelector | nindent 14 }}
            {{- else }}
            {}
            {{- end }}
      ports:
        - {protocol: TCP, port: {{ $port }}}
    - to:
        {{- range .Values.networkPolicy.todun.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
            {{- with $.Values.networkPolicy.todun.except }}
            except: {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 443}
{{- end }}
